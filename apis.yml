name: Qumranet
description: 'Qumranet was an Israeli software company that developed the Kernel-based
  Virtual Machine (KVM) hypervisor and the SPICE remote-desktop protocol, along with
  the SolidICE virtual desktop infrastructure product. It was acquired by Red Hat
  in September 2008, after which its technologies were folded into Red Hat''s
  virtualization portfolio (Red Hat Enterprise Virtualization / RHEV) and contributed
  upstream to the Linux kernel and open-source communities. Qumranet no longer exists
  as an independent company: the qumranet.com domain now issues a permanent (301)
  redirect to Red Hat''s enterprise virtualization page, and there is no independent
  Qumranet developer program, API surface, or documentation to enrich.'
